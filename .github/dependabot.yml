version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 20
    ignore:
      # Spring Framework → max 5.3.x (javax / Tomcat 9)
      - dependency-name: "org.springframework:*"
        versions: [">=6.0.0"]

      # Spring Security → max 5.8.x
      - dependency-name: "org.springframework.security:*"
        versions: [">=6.0.0"]

      # Hibernate → max 5.6.x (javax)
      - dependency-name: "org.hibernate:*"
        versions: [">=6.0.0"]
      - dependency-name: "org.hibernate.orm:*"
        versions: [">=6.0.0"]

      # Pas de Jakarta tant que Tomcat 9
      - dependency-name: "jakarta.servlet:*"
      - dependency-name: "jakarta.mail:*"
      - dependency-name: "jakarta.persistence:*"
      - dependency-name: "jakarta.annotation:*"

      # Projet abandonné
      - dependency-name: "org.springframework.mobile:*"